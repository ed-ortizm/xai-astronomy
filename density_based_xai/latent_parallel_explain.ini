[common]
bin = bin_03

[latent]
# iforest or lof 
model_type = lof

# Latent model filenames
iforest_model = iforest_bin_03_s128_e300_f100.joblib
lof_model = lof_bin_03_n60_manhattan.joblib
scaler_model = standard_scaler_bin_03.joblib

[directory]
phd = /home/elom/phd
data = ${phd}/code
spectra = ${data}/spectra
models = ${data}/models

latent_models = ${data}/latent/${common:bin}

explanations = ${data}/explanations/${common:bin}/${latent:model_type}

[file]
spectra = test_spectra_anomalies.npy
wave = wave_spectra_imputed.npy
ids = test_specobjids_anomalies.npy

[lime]
segmentation = uniform
number_segments = 110
number_samples = 100000
batch_size = 1000
progress_bar = False
distance_metric = cosine
number_features = 10000

[fudge]
kind_of_fudge = scale
scale_factor = 0.9
same_noise = True
kernel_size = 3
sigma = 0

[configuration]
seed = 42
jobs = 14
cores_per_worker = 1